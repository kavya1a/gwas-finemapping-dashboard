name: reproduce

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  reproduce-from-cache:
    name: Reproduce figures + headline numbers from cached data (no API key)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install nbformat nbconvert ipykernel

      # Regenerates every figure + every CSV table from the committed cache, then
      # runs tests/ (unit + the numeric smoke suite that re-derives each headline
      # number and checks it against the README). No API key, deterministic.
      - name: make reproduce
        run: make reproduce PYTHON=python

      # Canonical variant tests are a hard gate: all 5 must pass under the
      # rank-recovery / regulatory-detection split (see docs/canonical_variants.md).
      - name: Canonical variant tests (5/5 required)
        run: make verify PYTHON=python

      - name: Execute reproduction notebook end-to-end
        run: |
          jupyter nbconvert --to notebook --execute \
                            --output reproduce.executed.ipynb \
                            notebooks/reproduce.ipynb

      - name: Upload regenerated figures as artifact
        uses: actions/upload-artifact@v4
        with:
          name: figures
          path: figures/
          retention-days: 14
