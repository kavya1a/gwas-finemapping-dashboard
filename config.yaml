# ---------------------------------------------------------------------------
# Tewhey MPRA analysis
# ---------------------------------------------------------------------------
tewhey:
  geo_accession: "GSE75661"
  dataset_7k5_url: "https://ftp.ncbi.nlm.nih.gov/geo/series/GSE75nnn/GSE75661/suppl/GSE75661_7.5k_collapsed_counts.txt.gz"
  pseudocount: 1.0           # added before log2 to avoid log(0)
  cadd_rate_per_sec: 2.0     # conservative; CADD soft-bans rapid bursts
  cadd_retry_on_empty: 1     # empty-response retries before treating as not-found
  n_bootstrap: 1000          # Spearman CI bootstrap iterations
  variant_timeout_secs: 60
  min_expr_correlation: 0.10 # flag-and-stop threshold for expression_subscore
  max_liftover_loss_pct: 15  # flag-and-stop for coordinate resolution failure
  max_cadd_fail_pct: 10      # non-halting flag threshold

# ---------------------------------------------------------------------------
# CADD
# ---------------------------------------------------------------------------
cadd:
  version: "v1.7"
  genome: "GRCh38"
  tabix_url: "https://krishna.gs.washington.edu/download/CADD/v1.7/GRCh38/whole_genome_SNVs.tsv.gz"
  api_base: "https://cadd.gs.washington.edu/api/v1.0/GRCh38-v1.7"
